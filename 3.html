<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let totalAmount = parseFloat(prompt("Enter total amount:"));
        

        console.log("Total amount before discount:", totalAmount);

        if (totalAmount > 10000) {
            totalAmount *= 0.8; // Apply 20% discount
            console.log("Total amount after 20% discount:", totalAmount);
        } else if (totalAmount > 5000) {
            totalAmount *= 0.9; // Apply 10% discount
            console.log("Total amount after 10% discount:", totalAmount);
        } else {
            console.log("No discount applied. Total amount:", totalAmount);
        }
    </script>
</body>
</html>
