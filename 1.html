<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = 10;
        let b = 20;
    
        console.log("Before swapping: a =", a, "b =", b);

        let temp = a;
        a = b;
        b = temp;

        console.log("After swapping: a =", a, "b =", b);
    </script>
</body>
</html>
