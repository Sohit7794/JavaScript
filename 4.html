<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let countEven=0;
        let countOdd=0;
        for(let i =1; i<=99; i++){
            console.log(i);
            if (i % 2 === 0) { 
                countEven = countEven + 1;
            } else {
                countOdd = countOdd +1;
            }
        }
        console.log("No of even number: " , countEven)
        console.log("No of odd numbers: " , countOdd)
    </script>
</body>
</html>
